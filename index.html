<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodina Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0d0d0d; --card: #1c1c1e; --accent: #0088cc; --text: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .tabs { display: flex; gap: 8px; background: #252525; padding: 6px; border-radius: 14px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; color: #8e8e93; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .content { display: none; }
        .content.active { display: block; }
        .btn { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 14px; background: var(--card); color: #fff; font-size: 15px; text-align: left; border-left: 4px solid var(--accent); }
        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 12px; }
        .key-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .key { padding: 20px 5px; background: var(--card); border-radius: 12px; text-align: center; font-size: 13px; font-weight: bold; border: 1px solid #333; }
        .key:active { background: var(--accent); }
        .key-blue { color: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main')">Главная</button>
        <button class="tab-btn" onclick="openTab('keys')">Клавиши</button>
        <button class="tab-btn" onclick="openTab('sys')">Система</button>
    </div>

    <div id="main" class="content active">
        <button class="btn" onclick="send('run_zapad')">🚀 Запустить Rodina RP</button>
        <button class="btn" onclick="send('stream_toggle')">🎥 Стрим экрана (Вкл/Выкл)</button>
    </div>

    <div id="keys" class="content">
        <input type="text" id="textInput" placeholder="Введите текст...">
        <button class="btn" style="text-align:center; border-left:none; background: var(--accent);" onclick="sendText()">⌨️ Отправить в чат</button>
        <div class="key-grid">
            <div class="key key-blue" onclick="send('write:/hmenu')">/HMENU</div>
            <div class="key key-blue" onclick="send('write:/stats')">/STATS</div>
            <div class="key" onclick="send('key:esc')">ESC</div>
            <div class="key" style="grid-column: 2" onclick="send('key:up')">▲</div>
            <div class="key" onclick="send('key:left')">◀</div>
            <div class="key" onclick="send('key:down')">▼</div>
            <div class="key" onclick="send('key:right')">▶</div>
            <div class="key" onclick="send('key:w')">W</div>
            <div class="key" onclick="send('key:f6')">F6</div>
            <div class="key" onclick="send('key:enter')">ENTER</div>
            <div class="key" onclick="send('key:alt+tab')">ALT+TAB</div>
            <div class="key" onclick="send('key:space')">SPACE</div>
            <div class="key" onclick="send('key:alt+f4')">ALT+F4</div>
        </div>
    </div>

    <div id="sys" class="content">
        <button class="btn" style="border-left-color: #ff3b30;" onclick="send('off')">🛑 Выключить ПК</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function openTab(name) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.currentTarget.classList.add('active');
        }
        function send(cmd) { tg.sendData(cmd); }
        function sendText() {
            const input = document.getElementById('textInput');
            if(input.value) { send('write:' + input.value); input.value = ''; }
        }
    </script>
</body>
</html>
