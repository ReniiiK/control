<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Control Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f0f0f; --card: #1e1e1e; --accent: #00a2ff; --text: #e0e0e0; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .tabs { display: flex; gap: 5px; background: var(--card); padding: 5px; border-radius: 12px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #888; cursor: pointer; }
        .tab-btn.active { background: var(--bg); color: var(--accent); }
        .content { display: none; }
        .content.active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 15px; border: none; border-radius: 10px; background: var(--card); color: #fff; text-align: left; border-left: 4px solid var(--accent); }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
        .key-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .key { padding: 12px; background: #333; border-radius: 5px; text-align: center; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main')">Главная</button>
        <button class="tab-btn" onclick="openTab('keys')">Клавиши</button>
        <button class="tab-btn" onclick="openTab('sys')">Система</button>
    </div>

    <div id="main" class="content active">
        <div class="grid">
            <button class="btn" onclick="send('run_zapad')">🚀 Rodina RP</button>
            <button class="btn" onclick="send('stream_toggle')">🎥 Live Стрим</button>
            <button class="btn" onclick="send('write:/hmenu')">🏠 /hmenu</button>
            <button class="btn" onclick="send('write:/stats')">📊 /stats</button>
        </div>
    </div>

    <div id="keys" class="content">
        <input type="text" id="textInput" placeholder="Текст...">
        <button class="btn" style="width:100%; margin-bottom:10px;" onclick="sendText()">⌨️ Печатать</button>
        <div class="key-grid">
            <div class="key" onclick="send('key:up')">UP ⬆️</div>
            <div class="key" onclick="send('key:enter')">ENTER</div>
            <div class="key" onclick="send('key:esc')">ESC</div>
            <div class="key" onclick="send('key:left')">LEFT ⬅️</div>
            <div class="key" onclick="send('key:down')">DOWN ⬇️</div>
            <div class="key" onclick="send('key:right')">RIGHT ➡️</div>
            <div class="key" onclick="send('key:alt+tab')">ALT+TAB</div>
            <div class="key" onclick="send('key:f6')">F6 (Чат)</div>
            <div class="key" onclick="send('key:w')">W (Газ)</div>
        </div>
    </div>

    <div id="sys" class="content">
        <button class="btn" style="width:100%; border-left-color: red;" onclick="send('off')">🛑 Выключить ПК</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function openTab(name) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.currentTarget.classList.add('active');
        }
        function send(cmd) { tg.sendData(cmd); }
        function sendText() {
            const val = document.getElementById('textInput').value;
            if(val) { send('write:' + val); document.getElementById('textInput').value = ''; }
        }
    </script>
</body>
</html>
