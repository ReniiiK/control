<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Control Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --accent: #0088cc; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        
        /* Вкладки */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: var(--card); color: #888; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: #fff; }
        
        .content { display: none; }
        .content.active { display: block; }

        .btn { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 12px; background: var(--card); color: #fff; font-size: 15px; text-align: left; transition: 0.3s; }
        .btn:active { transform: scale(0.98); background: #3d3d3d; }
        
        #screen-view { width: 100%; border-radius: 12px; border: 2px solid var(--card); margin-top: 10px; }
        .status-dot { height: 10px; width: 10px; background-color: #4CAF50; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div style="margin-bottom: 15px;"><span class="status-dot"></span> <b>Live Control v4.1</b></div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main')">Главная</button>
        <button class="tab-btn" onclick="openTab('screen')">Экран</button>
        <button class="tab-btn" onclick="openTab('sys')">Система</button>
    </div>

    <div id="main" class="content active">
        <button class="btn" onclick="send('run_zapad')">🚀 Запустить Rodina (Zapad)</button>
        <button class="btn" onclick="send('screenshot')">📸 Разовый скриншот в чат</button>
    </div>

    <div id="screen" class="content">
        <p style="font-size: 12px; color: #888;">Обновление каждые 2 сек.</p>
        <img id="screen-view" src="https://via.placeholder.com/1280x720?text=Waiting+for+stream..." />
    </div>

    <div id="sys" class="content">
        <button class="btn" style="color: #ff4444;" onclick="send('off')">🛑 Выключить компьютер</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function openTab(name) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.currentTarget.classList.add('active');

            if(name === 'screen') startStream(); else stopStream();
        }

        function send(cmd) { tg.sendData(cmd); }

        let streamInterval;
        function startStream() {
            streamInterval = setInterval(() => {
                // Магия: добавляем timestamp, чтобы браузер не кешировал картинку
                document.getElementById('screen-view').src = "https://ТВОЙ_АДРЕС/live_screen.jpg?t=" + new Date().getTime();
            }, 2000);
        }

        function stopStream() { clearInterval(streamInterval); }
    </script>
</body>
</html>
