<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodina Control Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0d0d0d; --card: #1a1a1a; --accent: #0088cc; --text: #ffffff; --gray: #888; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; user-select: none; }
        
        .tabs { display: flex; gap: 5px; background: var(--card); padding: 5px; border-radius: 12px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; background: transparent; color: var(--gray); cursor: pointer; transition: 0.3s; font-weight: bold; }
        .tab-btn.active { background: #252525; color: var(--accent); }

        .content { display: none; animation: fadeIn 0.2s; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 15px; border: none; border-radius: 12px; background: var(--card); color: #fff; font-size: 14px; text-align: left; cursor: pointer; border-left: 4px solid var(--accent); }
        .btn:active { background: #222; transform: scale(0.98); }

        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        
        .key-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
        .key { padding: 15px 5px; background: #222; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; border: 1px solid #333; cursor: pointer; }
        .key:active { background: var(--accent); color: white; }
        
        .special-key { background: #2d2d2d; color: var(--accent); }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main')">Главная</button>
        <button class="tab-btn" onclick="openTab('keys')">Клавиши</button>
        <button class="tab-btn" onclick="openTab('sys')">Система</button>
    </div>

    <div id="main" class="content active">
        <div class="grid">
            <button class="btn" onclick="send('run_zapad')">🚀 Запустить Rodina</button>
            <button class="btn" onclick="send('stream_toggle')">🎥 Live Стрим</button>
            <button class="btn" onclick="send('write:/hmenu')">🏠 Дом (/hmenu)</button>
            <button class="btn" onclick="send('write:/stats')">📊 Стата (/stats)</button>
        </div>
    </div>

    <div id="keys" class="content">
        <input type="text" id="textInput" placeholder="Введите текст для игры...">
        <button class="btn" style="width:100%; text-align:center;" onclick="sendText()">⌨️ Напечатать в чат</button>
        
        <div class="key-grid">
            <div class="key" onclick="send('key:esc')">ESC</div>
            <div class="key special-key" onclick="send('key:up')">UP ⬆️</div>
            <div class="key" onclick="send('key:f6')">F6 (Чат)</div>
            
            <div class="key special-key" onclick="send('key:left')">LEFT ⬅️</div>
            <div class="key special-key" onclick="send('key:down')">DOWN ⬇️</div>
            <div class="key special-key" onclick="send('key:right')">RIGHT ➡️</div>
            
            <div class="key" onclick="send('key:w')">W (Газ)</div>
            <div class="key" onclick="send('key:enter')">ENTER</div>
            <div class="key" onclick="send('key:space')">SPACE</div>
            
            <div class="key" onclick="send('key:alt+tab')">ALT+TAB</div>
            <div class="key" onclick="send('key:alt+f4')">ALT+F4</div>
            <div class="key" onclick="send('key:tab')">TAB</div>
        </div>
    </div>

    <div id="sys" class="content">
        <button class="btn" style="width:100%; border-left-color: #ff9900;" onclick="send('reboot')">🔄 Перезагрузить ПК</button>
        <button class="btn" style="width:100%; margin-top:10px; border-left-color: #ff0000;" onclick="send('off')">🛑 Выключить ПК</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ВСТАВЬ СВОИ ДАННЫЕ ТУТ:
        const BOT_TOKEN = "8605766923:AAH5gWXQCJQ53s5bcLvTS9b5yLECnHfzyUA";
        const CHAT_ID = "7113810331";

        function openTab(name) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Функция отправки команды БЕЗ закрытия окна
        async function send(cmd) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(cmd)}&disable_notification=true`;
            try {
                await fetch(url);
            } catch (e) {
                console.error("Ошибка отправки:", e);
                // Если fetch не сработал, пробуем через Telegram (но окно закроется)
                tg.sendData(cmd);
            }
        }

        async function sendText() {
            const input = document.getElementById('textInput');
            if(input.value) {
                await send('write:' + input.value);
                input.value = '';
            }
        }
    </script>
</body>
</html>
