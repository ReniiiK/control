<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Control Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0a0a0a; --card: #1a1a1a; --accent: #0088cc; --text: #efefef; --danger: #cc0000; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; background: var(--card); color: #777; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); color: #fff; font-weight: bold; }
        
        .content { display: none; }
        .content.active { display: block; }

        .btn { width: 100%; padding: 16px; margin: 6px 0; border: none; border-radius: 12px; background: var(--card); color: #fff; font-size: 15px; text-align: left; cursor: pointer; border-left: 5px solid var(--accent); }
        .btn:active { background: #252525; transform: translateY(2px); }
        .btn-danger { border-left-color: var(--danger); color: #ff9999; }

        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        
        .key-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .key { padding: 12px; background: #222; border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; border: 1px solid #333; }
        .key:active { background: var(--accent); }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('main')">Главная</button>
        <button class="tab-btn" onclick="openTab('keys')">Клавиши</button>
        <button class="tab-btn" onclick="openTab('sys')">Система</button>
    </div>

    <div id="main" class="content active">
        <button class="btn" onclick="send('run_zapad')">🚀 Запустить Rodina RP (Zapad)</button>
        <button class="btn" onclick="send('pc_info')">📊 Информация о системе</button>
        <button class="btn" onclick="send('stream_toggle')">🎥 Живой поток (Вкл/Выкл)</button>
    </div>

    <div id="keys" class="content">
        <input type="text" id="txt" placeholder="Введите текст для печати...">
        <button class="btn" onclick="sendText()">⌨️ Напечатать текст</button>
        
        <div class="key-grid">
            <div class="key" onclick="send('key:enter')">ENTER</div>
            <div class="key" onclick="send('key:esc')">ESC</div>
            <div class="key" onclick="send('key:tab')">TAB</div>
            <div class="key" onclick="send('key:f8')">F8</div>
            <div class="key" onclick="send('key:f10')">F10</div>
            <div class="key" onclick="send('key:alt+f4')">ALT+F4</div>
            <div class="key" onclick="send('key:space')">SPACE</div>
            <div class="key" onclick="send('key:up')">UP</div>
            <div class="key" onclick="send('key:down')">DOWN</div>
        </div>
    </div>

    <div id="sys" class="content">
        <button class="btn" onclick="send('reboot')">🔄 Перезагрузить ПК</button>
        <button class="btn btn-danger" onclick="send('off')">🛑 Выключить компьютер</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function openTab(name) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function send(cmd) { tg.sendData(cmd); }

        function sendText() {
            const input = document.getElementById('txt');
            if(input.value) {
                send('write:' + input.value);
                input.value = '';
            }
        }
    </script>
</body>
</html>
